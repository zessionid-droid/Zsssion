<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Zession — Intro</title>
  <style>
    *, *::before, *::after {
      margin: 0; padding: 0; box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --accent: #3b82f6;
      --accent-light: #60a5fa;
      --accent-2: #38bdf8;
      --text: #f0f9ff;
      --text-muted: rgba(191, 219, 254, 0.7);
      --success: #86efac;
      --danger: #fca5a5;
      --input-bg: rgba(15, 23, 42, 0.55);
      --input-border: rgba(96, 165, 250, 0.3);
    }

    html, body {
      min-height: 100vh; width: 100%;
      overflow-x: hidden;
      touch-action: pan-y;
      background-color: #020817;
      color: var(--text);
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
      -webkit-user-select: none;
      user-select: none;
      isolation: isolate;
    }

    /* ═══════════ BACKGROUND ═══════════ */
    .bg-image {
      position: fixed; inset: 0;
      background: url('background.png') no-repeat center center;
      background-size: cover;
      z-index: 0;
      animation: slowZoom 30s ease-in-out infinite alternate;
      will-change: transform;
    }

    @keyframes slowZoom {
      0%   { transform: scale(1); }
      100% { transform: scale(1.08); }
    }

    .bg-overlay {
      position: fixed; inset: 0;
      background: radial-gradient(circle at 30% 20%, rgba(20, 60, 140, 0.55), rgba(2, 8, 23, 0.92));
      z-index: 1;
      pointer-events: none;
    }

    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.45;
      pointer-events: none;
      z-index: 2;
      will-change: transform;
    }

    .orb-1 {
      width: 320px; height: 320px;
      background: radial-gradient(circle, #3b82f6, transparent 70%);
      top: -120px; left: -100px;
      animation: float1 20s ease-in-out infinite;
    }
    .orb-2 {
      width: 260px; height: 260px;
      background: radial-gradient(circle, #38bdf8, transparent 70%);
      bottom: -80px; right: -80px;
      animation: float2 24s ease-in-out infinite;
    }
    .orb-3 {
      width: 200px; height: 200px;
      background: radial-gradient(circle, #6366f1, transparent 70%);
      top: 40%; right: 5%;
      animation: float3 16s ease-in-out infinite;
    }

    @keyframes float1 {
      0%, 100% { transform: translate(0, 0); }
      50%      { transform: translate(60px, 80px); }
    }
    @keyframes float2 {
      0%, 100% { transform: translate(0, 0); }
      50%      { transform: translate(-70px, -60px); }
    }
    @keyframes float3 {
      0%, 100% { transform: translate(0, 0); }
      50%      { transform: translate(40px, -50px); }
    }

    /* ═══════════ CARD ═══════════ */
    .intro-container {
      width: 100%;
      max-width: 500px;
      position: relative;
      z-index: 10;
      margin: auto;
    }

    .intro-card {
      background: linear-gradient(145deg, rgba(30, 64, 175, 0.28), rgba(15, 23, 42, 0.55));
      backdrop-filter: blur(24px) saturate(160%);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
      border: 1px solid rgba(96, 165, 250, 0.28);
      border-radius: 2rem;
      padding: 2rem 1.8rem 2.2rem;
      box-shadow:
        0 30px 60px -20px rgba(0, 0, 0, 0.8),
        0 0 0 1px rgba(96, 165, 250, 0.08) inset,
        0 1px 0 rgba(147, 197, 253, 0.25) inset;
      animation: cardIn 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes cardIn {
      0%   { opacity: 0; transform: translateY(40px) scale(0.94); filter: blur(8px); }
      100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    }

    .intro-logo {
      width: 84px; height: 84px;
      margin: 0 auto 1.2rem;
      padding: 3px;
      border-radius: 26px;
      background: linear-gradient(135deg, #60a5fa, #3b82f6, #38bdf8);
      box-shadow: 0 12px 30px -6px rgba(59, 130, 246, 0.7), 0 0 40px -8px rgba(56, 189, 248, 0.6);
      animation: logoFloat 3s ease-in-out infinite;
      will-change: transform;
      position: relative;
    }

    .intro-logo::after {
      content: '';
      position: absolute;
      inset: -6px;
      border-radius: 32px;
      border: 2px solid rgba(96, 165, 250, 0.35);
      animation: logoPulseRing 2.5s ease-out infinite;
      pointer-events: none;
    }

    @keyframes logoPulseRing {
      0%   { transform: scale(1);   opacity: 0.7; }
      100% { transform: scale(1.4); opacity: 0; }
    }

    @keyframes logoFloat {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-6px); }
    }

    .intro-logo img {
      width: 100%; height: 100%;
      object-fit: cover;
      border-radius: 23px;
      display: block;
    }

    .intro-title {
      text-align: center;
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: -0.7px;
      line-height: 1.2;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #ffffff 0%, #60a5fa 50%, #38bdf8 100%);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradientShift 5s ease infinite;
    }

    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      50%      { background-position: 100% 50%; }
    }

    .intro-subtitle {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.87rem;
      margin-bottom: 1.8rem;
      line-height: 1.5;
    }

    .field {
      margin-bottom: 1rem;
      opacity: 0;
      animation: fieldIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .field:nth-child(1) { animation-delay: 0.35s; }
    .field:nth-child(2) { animation-delay: 0.43s; }
    .field:nth-child(3) { animation-delay: 0.51s; }
    .field:nth-child(4) { animation-delay: 0.59s; }
    .field.upload-field  { animation-delay: 0.67s; }
    .field.submit-field  { animation-delay: 0.75s; }

    @keyframes fieldIn {
      from { opacity: 0; transform: translateY(15px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .field label {
      display: block;
      font-size: 0.76rem;
      font-weight: 600;
      margin-bottom: 0.42rem;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .field input[type="text"] {
      width: 100%;
      padding: 0.88rem 1rem;
      background: var(--input-bg);
      border: 1.5px solid var(--input-border);
      border-radius: 0.85rem;
      font-size: 0.92rem;
      color: var(--text);
      outline: none;
      transition: all 0.25s ease;
      -webkit-user-select: text;
      user-select: text;
    }

    .field input[type="text"]:focus {
      border-color: var(--accent-light);
      background: rgba(15, 23, 42, 0.75);
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.18);
      transform: translateY(-1px);
    }

    .field input[type="text"].error {
      border-color: var(--danger);
      box-shadow: 0 0 0 4px rgba(248, 113, 113, 0.15);
    }

    /* Upload Zone */
    .upload-zone {
      position: relative;
      border: 2px dashed rgba(96, 165, 250, 0.4);
      border-radius: 1rem;
      padding: 1.6rem 1rem 1.4rem;
      text-align: center;
      cursor: pointer;
      background: rgba(15, 23, 42, 0.4);
      transition: all 0.3s ease;
      overflow: hidden;
    }

    .upload-zone::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(96, 165, 250, 0.15), transparent);
      animation: uploadShine 3.5s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes uploadShine {
      0%, 60% { left: -100%; }
      100%    { left: 100%; }
    }

    .upload-zone:hover {
      border-color: var(--accent-light);
      background: rgba(59, 130, 246, 0.1);
      transform: translateY(-2px);
      box-shadow: 0 10px 26px -10px rgba(59, 130, 246, 0.5);
    }

    .upload-zone.drag-over {
      border-color: var(--accent-2);
      background: rgba(56, 189, 248, 0.15);
      transform: scale(1.02);
      box-shadow: 0 12px 30px -8px rgba(56, 189, 248, 0.6);
    }

    .upload-icon {
      width: 60px; height: 60px;
      margin: 0 auto 0.75rem;
      background: rgba(59, 130, 246, 0.15);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: uploadIconFloat 2.5s ease-in-out infinite;
      will-change: transform;
    }

    @keyframes uploadIconFloat {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-5px); }
    }

    .upload-icon svg {
      width: 30px; height: 30px;
      stroke: var(--accent-light);
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .upload-title {
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--text);
      margin-bottom: 0.3rem;
    }

    .upload-subtitle {
      font-size: 0.73rem;
      color: var(--text-muted);
    }

    .file-preview {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.8rem;
      background: rgba(59, 130, 246, 0.12);
      border: 1px solid rgba(96, 165, 250, 0.35);
      border-radius: 0.9rem;
      margin-top: 0.7rem;
      animation: previewIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes previewIn {
      from { opacity: 0; transform: translateY(-12px) scale(0.94); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .preview-thumb {
      width: 46px; height: 46px;
      border-radius: 11px;
      background: rgba(15, 23, 42, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
      border: 1px solid rgba(96, 165, 250, 0.25);
    }

    .preview-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .preview-thumb svg {
      width: 24px; height: 24px;
      stroke: var(--accent-light);
      fill: none;
      stroke-width: 1.8;
    }

    .preview-info { flex: 1; min-width: 0; text-align: left; }

    .preview-name {
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .preview-size { font-size: 0.72rem; color: var(--text-muted); margin-top: 0.15rem; }

    .remove-file {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: rgba(248, 113, 113, 0.15);
      color: #fca5a5;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.25s ease;
      outline: none;
    }

    .remove-file:hover {
      background: rgba(248, 113, 113, 0.3);
      transform: rotate(90deg) scale(1.1);
    }

    .remove-file svg {
      width: 16px; height: 16px;
      stroke: currentColor;
      stroke-width: 2.4;
      stroke-linecap: round;
    }

    .submit-btn {
      position: relative;
      width: 100%;
      padding: 1rem;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white;
      border: none;
      border-radius: 1rem;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.3px;
      cursor: pointer;
      overflow: hidden;
      box-shadow: 0 15px 30px -10px rgba(37, 99, 235, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.55rem;
      transition: transform 0.25s ease, box-shadow 0.25s ease, filter 0.2s ease;
      outline: none;
    }

    .submit-btn::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.35), transparent);
      transition: left 0.75s ease;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 20px 40px -10px rgba(37, 99, 235, 0.9);
      filter: brightness(1.08);
    }

    .submit-btn:hover::before { left: 100%; }
    .submit-btn:active { transform: translateY(0) scale(0.98); }
    .submit-btn:disabled { opacity: 0.75; cursor: not-allowed; pointer-events: none; }

    .submit-btn svg {
      width: 20px; height: 20px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .btn-spinner {
      width: 18px; height: 18px;
      border: 2.5px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .feedback {
      font-size: 0.8rem;
      margin-top: 0.75rem;
      text-align: center;
      min-height: 1rem;
      color: var(--danger);
      font-weight: 600;
      animation: fadeUp 0.3s ease;
      line-height: 1.4;
    }

    .feedback.success { color: var(--success); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .success-overlay {
      position: fixed; inset: 0;
      background: radial-gradient(circle at 50% 40%, rgba(20, 60, 140, 0.96), rgba(2, 8, 23, 0.99));
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 1.5rem;
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }

    .success-overlay.show { opacity: 1; pointer-events: auto; }

    .success-check {
      width: 110px; height: 110px;
      border-radius: 50%;
      background: rgba(34, 197, 94, 0.15);
      border: 3px solid var(--success);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: checkPop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    @keyframes checkPop {
      0%   { transform: scale(0) rotate(-180deg); opacity: 0; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    .success-check svg {
      width: 55px; height: 55px;
      stroke: var(--success);
      stroke-width: 3;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 80;
      stroke-dashoffset: 80;
      animation: checkDraw 0.6s ease 0.5s forwards;
    }

    @keyframes checkDraw { to { stroke-dashoffset: 0; } }

    .success-title {
      color: white;
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.4px;
      text-align: center;
      animation: fadeUp 0.5s ease 0.7s both;
    }

    .success-sub {
      color: var(--text-muted);
      font-size: 0.87rem;
      text-align: center;
      max-width: 320px;
      line-height: 1.5;
      animation: fadeUp 0.5s ease 0.85s both;
    }

    @media (max-width: 480px) {
      .intro-card { padding: 1.6rem 1.3rem 1.8rem; border-radius: 1.6rem; }
      .intro-title { font-size: 1.5rem; }
      .intro-logo { width: 72px; height: 72px; border-radius: 22px; }
      .intro-logo img { border-radius: 19px; }
      .upload-zone { padding: 1.3rem 0.9rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <div class="bg-image"></div>
  <div class="bg-overlay"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <div class="intro-container">
    <div class="intro-card">
      <div class="intro-logo">
        <img src="logo.png" alt="Zession" draggable="false" />
      </div>

      <h1 class="intro-title">Selamat Datang di Zession</h1>
      <p class="intro-subtitle">Lengkapi intro di bawah ini. Data akan dikirim langsung ke owner untuk verifikasi.</p>

      <form id="introForm" novalidate>
        <div class="field">
          <label for="introRoblox">Username Roblox</label>
          <input type="text" id="introRoblox" placeholder="Contoh: ZessionDev" autocomplete="off" spellcheck="false" />
        </div>
        <div class="field">
          <label for="introNama">Nama Asli</label>
          <input type="text" id="introNama" placeholder="Nama lengkap kamu" autocomplete="off" />
        </div>
        <div class="field">
          <label for="introKota">Asal Kota</label>
          <input type="text" id="introKota" placeholder="Contoh: Jakarta" autocomplete="off" />
        </div>
        <div class="field">
          <label for="introGame">Game Favorit</label>
          <input type="text" id="introGame" placeholder="Contoh: Blox Fruits" autocomplete="off" />
        </div>

        <div class="field upload-field">
          <label>Bukti Pendukung <span style="opacity:.6;text-transform:none;font-weight:400;">(opsional)</span></label>
          <div class="upload-zone" id="uploadZone">
            <div class="upload-icon">
              <svg viewBox="0 0 24 24">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="17 8 12 3 7 8"/>
                <line x1="12" y1="3" x2="12" y2="15"/>
              </svg>
            </div>
            <div class="upload-title">Klik atau drag file ke sini</div>
            <div class="upload-subtitle">PNG, JPG, atau PDF • Maksimal 10 MB</div>
            <input type="file" id="introBukti" accept="image/*,.pdf" hidden />
          </div>

          <div class="file-preview" id="filePreview" hidden>
            <div class="preview-thumb" id="previewThumb"></div>
            <div class="preview-info">
              <div class="preview-name" id="previewName"></div>
              <div class="preview-size" id="previewSize"></div>
            </div>
            <button type="button" class="remove-file" id="removeFile" aria-label="Hapus file">
              <svg viewBox="0 0 24 24">
                <line x1="18" y1="6" x2="6" y2="18"/>
                <line x1="6" y1="6" x2="18" y2="18"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="field submit-field">
          <button type="submit" class="submit-btn" id="introSubmit">
            <span class="btn-label">Kirim ke Owner</span>
            <svg viewBox="0 0 24 24">
              <line x1="22" y1="2" x2="11" y2="13"/>
              <polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
          </button>
          <div class="feedback" id="introFeedback"></div>
        </div>
      </form>
    </div>
  </div>

  <div class="success-overlay" id="successOverlay">
    <div class="success-check">
      <svg viewBox="0 0 52 52"><polyline points="14 27 22 35 38 19"/></svg>
    </div>
    <div class="success-title">Intro Terkirim!</div>
    <div class="success-sub">Data kamu sudah dikirim ke owner. Mengarahkan ke dashboard...</div>
  </div>

  <script>
    (function () {
      'use strict';

      /* ═══════════════════════════════════════════════════
         ⚠️ ISI KONFIGURASI DI SINI (TANPA BASE64)
         ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

         1️⃣ BOT_TOKEN
             → Chat @BotFather → /newbot → copy token
             → Contoh: 7123456789:AAHxxxxxxxxxxxxxxxxxxxx

         2️⃣ CHAT_ID
             → Chat @userinfobot → klik Start → copy "Id"
             → Contoh: 1234567890

         Kalau chat ID kamu berupa angka negatif (grup),
         itu juga boleh (misal -1001234567890).
      ═══════════════════════════════════════════════════ */

      const BOT_TOKEN = '8891819811:AAHgXPiE0aBgw5izGHm2B2smTRjFMCzyDgo';   // ← GANTI INI
      const CHAT_ID   = '8690779823';     // ← GANTI INI

      /* ═══════════ SESSION ═══════════ */
      const SESSION_KEY  = 'zession_current_user';
      const INTRO_PREFIX = 'zession_intro_';

      const currentUser = (() => {
        try { return sessionStorage.getItem(SESSION_KEY); }
        catch (_) { return null; }
      })();

      if (!currentUser) {
        window.location.replace('index.html');
        return;
      }

      const getIntro = () => {
        try { return JSON.parse(localStorage.getItem(INTRO_PREFIX + currentUser.toLowerCase())); }
        catch (_) { return null; }
      };
      const saveIntro = (data) => {
        try { localStorage.setItem(INTRO_PREFIX + currentUser.toLowerCase(), JSON.stringify(data)); } catch (_) {}
      };

      const existing = getIntro();
      if (existing && existing.submitted) {
        window.location.replace('dashboard.html');
        return;
      }

      /* ═══════════ TELEGRAM SENDER ═══════════ */
      async function sendToTelegram(data, file) {
        // Cek konfigurasi dulu
        if (!BOT_TOKEN || BOT_TOKEN === 'ISI_TOKEN_BOT_DI_SINI') {
          throw new Error('❌ BOT_TOKEN belum diisi. Buka intro.html, cari "const BOT_TOKEN" dan isi dengan token dari @BotFather.');
        }
        if (!CHAT_ID || CHAT_ID === 'ISI_CHAT_ID_DI_SINI') {
          throw new Error('❌ CHAT_ID belum diisi. Buka intro.html, cari "const CHAT_ID" dan isi dengan ID dari @userinfobot.');
        }

        const message =
          '🎉 *INTRO BARU ZESSION*\n' +
          '━━━━━━━━━━━━━━━━━━━\n' +
          '👤 *Akun:* ' + data.akun + '\n' +
          '🎮 *Username Roblox:* ' + data.roblox + '\n' +
          '📝 *Nama Asli:* ' + data.nama + '\n' +
          '🏙️ *Asal Kota:* ' + data.kota + '\n' +
          '🎯 *Game Favorit:* ' + data.game + '\n' +
          '━━━━━━━━━━━━━━━━━━━\n' +
          '⏰ ' + new Date().toLocaleString('id-ID');

        // Kirim pesan teks
        let res;
        try {
          res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              chat_id: CHAT_ID,
              text: message,
              parse_mode: 'Markdown'
            })
          });
        } catch (netErr) {
          throw new Error('🌐 Gagal terhubung ke Telegram. Cek koneksi internet atau pastikan halaman dibuka via http/https (bukan file://).');
        }

        const j = await res.json();
        if (!j.ok) {
          // Terjemahkan error Telegram ke bahasa manusia
          let hint = j.description || 'unknown';
          if (j.error_code === 401) hint = 'Token bot tidak valid. Cek lagi BOT_TOKEN.';
          else if (j.error_code === 400 && hint.includes('chat not found')) hint = 'Chat ID salah / bot belum di-start. Buka bot kamu di Telegram lalu klik Start.';
          else if (j.error_code === 403) hint = 'Bot diblokir oleh user. Unblock bot di Telegram.';
          throw new Error('❌ Telegram error: ' + hint);
        }

        // Kirim file jika ada
        if (file) {
          const fd = new FormData();
          fd.append('chat_id', CHAT_ID);
          fd.append('document', file);
          fd.append('caption', '📎 Bukti dari *' + data.roblox + '*');
          fd.append('parse_mode', 'Markdown');
          const r2 = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendDocument`, {
            method: 'POST', body: fd
          });
          const j2 = await r2.json();
          if (!j2.ok) {
            throw new Error('⚠️ Pesan teks terkirim, tapi file gagal: ' + (j2.description || 'unknown') + '. Coba upload tanpa file.');
          }
        }
        return true;
      }

      /* ═══════════ UPLOAD ZONE ═══════════ */
      const uploadZone   = document.getElementById('uploadZone');
      const fileInput    = document.getElementById('introBukti');
      const filePreview  = document.getElementById('filePreview');
      const previewThumb = document.getElementById('previewThumb');
      const previewName  = document.getElementById('previewName');
      const previewSize  = document.getElementById('previewSize');
      const removeBtn    = document.getElementById('removeFile');

      let selectedFile = null;

      const formatSize = (b) => b < 1024 ? b + ' B' : b < 1048576 ? (b / 1024).toFixed(1) + ' KB' : (b / 1048576).toFixed(2) + ' MB';
      const pdfIcon = `<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="15" x2="15" y2="15"/></svg>`;

      const showPreview = (file) => {
        selectedFile = file;
        filePreview.hidden = false;
        if (file.type.startsWith('image/')) {
          const reader = new FileReader();
          reader.onload = (e) => { previewThumb.innerHTML = `<img src="${e.target.result}" alt="preview" />`; };
          reader.readAsDataURL(file);
        } else {
          previewThumb.innerHTML = pdfIcon;
        }
        previewName.textContent = file.name;
        previewSize.textContent = formatSize(file.size);
      };

      const clearPreview = () => {
        selectedFile = null;
        fileInput.value = '';
        filePreview.hidden = true;
        previewThumb.innerHTML = '';
      };

      uploadZone.addEventListener('click', () => fileInput.click());
      fileInput.addEventListener('change', (e) => { if (e.target.files[0]) showPreview(e.target.files[0]); });
      removeBtn.addEventListener('click', (e) => { e.stopPropagation(); clearPreview(); });

      ['dragenter', 'dragover'].forEach(evt => {
        uploadZone.addEventListener(evt, (e) => { e.preventDefault(); uploadZone.classList.add('drag-over'); });
      });
      ['dragleave', 'drop'].forEach(evt => {
        uploadZone.addEventListener(evt, (e) => { e.preventDefault(); uploadZone.classList.remove('drag-over'); });
      });
      uploadZone.addEventListener('drop', (e) => {
        const file = e.dataTransfer.files[0];
        if (file) {
          if (file.size > 10 * 1024 * 1024) { showFeedback('File terlalu besar (maks 10 MB).'); return; }
          showPreview(file);
        }
      });

      /* ═══════════ FORM SUBMIT ═══════════ */
      const introForm     = document.getElementById('introForm');
      const introSubmit   = document.getElementById('introSubmit');
      const introFeedback = document.getElementById('introFeedback');
      const successOverlay = document.getElementById('successOverlay');

      const showFeedback = (msg, success = false) => {
        introFeedback.textContent = msg;
        introFeedback.className = 'feedback' + (success ? ' success' : '');
      };

      introForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        introFeedback.textContent = '';
        introFeedback.className = 'feedback';

        const roblox = document.getElementById('introRoblox');
        const nama   = document.getElementById('introNama');
        const kota   = document.getElementById('introKota');
        const game   = document.getElementById('introGame');

        [roblox, nama, kota, game].forEach(i => i.classList.remove('error'));

        if (!roblox.value.trim() || roblox.value.trim().length < 3) {
          roblox.classList.add('error'); roblox.focus();
          showFeedback('Username Roblox minimal 3 karakter.'); return;
        }
        if (!nama.value.trim() || nama.value.trim().length < 3) {
          nama.classList.add('error'); nama.focus();
          showFeedback('Nama asli minimal 3 karakter.'); return;
        }
        if (!kota.value.trim()) { kota.classList.add('error'); kota.focus(); showFeedback('Asal kota wajib diisi.'); return; }
        if (!game.value.trim()) { game.classList.add('error'); game.focus(); showFeedback('Game favorit wajib diisi.'); return; }

        introSubmit.disabled = true;
        const originalHTML = introSubmit.innerHTML;
        introSubmit.innerHTML = '<div class="btn-spinner"></div><span>Mengirim...</span>';

        const data = {
          akun: currentUser,
          roblox: roblox.value.trim(),
          nama: nama.value.trim(),
          kota: kota.value.trim(),
          game: game.value.trim()
        };

        try {
          await sendToTelegram(data, selectedFile);
          saveIntro({ ...data, submitted: true, submittedAt: new Date().toISOString() });
          successOverlay.classList.add('show');
          setTimeout(() => window.location.replace('dashboard.html'), 2200);
        } catch (err) {
          showFeedback(err.message || 'Gagal mengirim. Coba lagi.');
          introSubmit.disabled = false;
          introSubmit.innerHTML = originalHTML;
        }
      });

      ['introRoblox', 'introNama', 'introKota', 'introGame'].forEach(id => {
        document.getElementById(id).addEventListener('input', function () { this.classList.remove('error'); });
      });
    })();
  </script>
</body>
</html>
